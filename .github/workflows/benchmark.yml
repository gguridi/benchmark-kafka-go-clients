name: Benchmark

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { type: producer, num_messages: 10000, message_size: 1000 }
          - { type: producer, num_messages: 10000, message_size: 5000 }
          - { type: producer, num_messages: 1000000, message_size: 1000 }
          - { type: producer, num_messages: 1000000, message_size: 5000 }
          - { type: consumer, num_messages: 100000, message_size: 1000 }
          - { type: consumer, num_messages: 100000, message_size: 2500 }
          - { type: consumer, num_messages: 1000000, message_size: 1000 }
          - { type: consumer, num_messages: 1000000, message_size: 2500 }
    name: ${{ matrix.type }} ${{ matrix.num_messages }}x${{ matrix.message_size }}B
    steps:
      - name: Free disk space
        run: sudo apt-get clean && df -h
      - name: Run Kafka instance
        run: docker run --name benchmark-kafka -e KAFKA__ADVERTISED_HOST_NAME=localhost -d -p 9092:9092 -p 2181:2181 gguridi/kafka:2.12-2.0.0
      - uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Ginkgo
        run: go install github.com/onsi/ginkgo/ginkgo@v1.16.5
      - name: Benchmark all libraries
        run: scripts/benchmark.sh ${{ matrix.type }} ${{ matrix.num_messages }} ${{ matrix.message_size }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.type }}-${{ matrix.num_messages }}-${{ matrix.message_size }}
          path: results/*.json

  publish:
    needs: benchmark
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - uses: actions/download-artifact@v4
        with:
          path: web/src/results
          merge-multiple: true
      - name: Deploy into github pages
        working-directory: web
        run: |
          yarn install --frozen-lockfile
          yarn deploy
